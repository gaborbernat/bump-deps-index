[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.32.4",
]

[project]
name = "bump-deps-index"
import-names = [ "bump_deps_index" ]
description = "Bump your dependencies to latest available from index."
keywords = [
  "bump",
  "index",
  "pypi",
  "version",
]
license = "MIT"
license-files = [ "LICENSE" ]
maintainers = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = [
  "readme",
  "version",
]
dependencies = [
  "httpx>=0.28.1",
  "packaging>=26.3",
  "pyyaml>=6.0.3",
  "truststore>=0.10.4",
  "typing-extensions>=4.16",
]
urls.Changelog = "https://bump-deps-index.readthedocs.io/en/latest/changelog.html"
urls.Documentation = "https://bump-deps-index.readthedocs.io"
urls.Homepage = "https://github.com/gaborbernat/bump-deps-index"
urls.Source = "https://github.com/gaborbernat/bump-deps-index"
urls.Tracker = "https://github.com/gaborbernat/bump-deps-index/issues"
scripts.bump-deps-index = "bump_deps_index.__main__:main"

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "pkg-meta" },
  { include-group = "test" },
  { include-group = "type" },
]
test = [
  "covdefaults>=2.3",
  "pytest>=9.1.1",
  "pytest-cov>=7.1",
  "pytest-httpx>=0.36.2",
  "pytest-mock>=3.16",
]
type = [
  "ty>=0.0.84",
  { include-group = "docs" },
  { include-group = "test" },
]
docs = [
  "furo>=2025.12.19",
  "sphinx>=9.0.4",
  "sphinx-argparse-cli>=1.23",
  "uv>=0.12.22",
]
build = [
  "cython>=3",
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.32.4",
  "setuptools>=80",
]
lint = [ "pre-commit-uv>=4.3" ]
pkg-meta = [ "check-wheel-contents>=0.6.3", "twine>=7", "uv>=0.12.22" ]
release-check = [
  "prek>=0.5",
]
release-news = [
  "release-creator>=3.1",
  "towncrier>=26.9",
]
release-notes = [
  "release-creator>=3.1",
]
release-prepare = [
  "prek>=0.5",
  "release-creator>=3.1",
  "towncrier>=26.9",
]
release-validate = [
  "prek>=0.5",
  "release-creator>=3.1",
]

[tool.hatch]
version.source = "vcs"
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
build.hooks.vcs.version-file = "src/bump_deps_index/version.py"

[tool.uv]
dependency-groups.release-check = { requires-python = ">=3.15" }
dependency-groups.release-news = { requires-python = ">=3.15" }
dependency-groups.release-notes = { requires-python = ">=3.15" }
dependency-groups.release-prepare = { requires-python = ">=3.15" }
dependency-groups.release-validate = { requires-python = ">=3.15" }

[tool.black]
line-length = 120

[tool.ruff]
target-version = "py311"
line-length = 120
format.preview = true
format.docstring-code-line-length = 100
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "CPY",                                       # The project does not add copyright headers to individual files
  "DOC",                                       # Public API documentation is generated from signatures
  "incorrect-blank-line-before-class",         # `one-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible
  "missing-trailing-comma",                    # Conflict with formatter
  "multi-line-summary-first-line",             # `multi-line-summary-first-line` (D212) and `multi-line-summary-second-line` (D213) are incompatible
  "non-empty-init-module",                     # `__init__` module should only contain docstrings and re-exports
  "single-line-implicit-string-concatenation", # Conflict with formatter
]
lint.per-file-ignores."tests/**/*.py" = [
  "assert",                               # Tests use assertions
  "D",                                    # Test names document behavior
  "FBT",                                  # Boolean parameters keep parameterized cases compact
  "implicit-namespace-package",           # The tests directory is not a package
  "import-private-name",                  # Tests cover private parsing boundaries directly
  "magic-value-comparison",               # Literal expected values keep assertions local
  "subprocess-without-shell-equals-true", # Entry-point arguments are fixed by the tests
  "suspicious-subprocess-import",         # Entry-point tests invoke a local Python executable
  "too-many-positional-arguments",        # Test inputs favor explicit parameters over setup objects
]
lint.isort = { known-first-party = [
  "bump_deps_index",
], required-imports = [
  "from __future__ import annotations",
] }
lint.preview = true

[tool.codespell]
builtin = "clear,usage,en-GB_to_en-US"
count = true

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.ty]
environment.python-version = "3.15"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.filterwarnings = [
  "error",
  "ignore:unclosed database in <sqlite3.Connection object at:ResourceWarning",
]
ini_options.verbosity_assertions = 2

[tool.coverage]
run.parallel = true
run.plugins = [
  "covdefaults",
]
run.core = "ctrace"  # sysmon (3.14+ default) cannot record the per-test contexts we collect
paths.source = [
  "src",
  ".tox*/*/lib/python*/site-packages",
  ".tox*/pypy*/site-packages",
  ".tox*\\*\\Lib\\site-packages",
  "*/src",
  "*\\src",
]
report.fail_under = 100
html.show_contexts = true
html.skip_covered = false

[tool.towncrier]
name = "bump-deps-index"
directory = "docs/changelog.d"
filename = "docs/changelog.rst"
template = "release_creator.fragments:template.rst.jinja2"
title_format = false
underlines = [ "-", "~", "^" ]
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "change", name = "Changes", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "doc", name = "Documentation", showcontent = true },
  { directory = "breaking", name = "Breaking changes", showcontent = true },
  { directory = "security", name = "Security", showcontent = true },
  { directory = "performance", name = "Performance", showcontent = true },
  { directory = "deprecation", name = "Deprecated", showcontent = true },
  { directory = "removal", name = "Removed", showcontent = true },
  { directory = "packaging", name = "Packaging", showcontent = true },
]

[tool.nab]
mode = "universal"
base-group = "project-runtime"
uploaded-prior-to = "P7D"
decision-order = "stable"
matrix.python = ">=3.15,<3.16"
matrix.platforms = [ "linux_x86_64" ]
# temporary, delete after 2026-11-02
packages.release-creator.uploaded-prior-to = 2026-10-26T00:42:37Z
