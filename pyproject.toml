[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs>=0.5",
  "hatchling>=1.27",
]

[project]
name = "bump-deps-index"
description = "Bump your dependencies to latest available from index."
readme = "README.md"
keywords = [
  "bump",
  "index",
  "pypi",
  "version",
]
license.file = "LICENSE"
maintainers = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = [
  "version",
]
dependencies = [
  "httpx>=0.28.1",
  "packaging>=25",
  "pyyaml>=6.0.3",
  "truststore>=0.10.4",
  "typing-extensions>=4.4",
]
urls.Documentation = "https://bump-deps-index.readthedocs.io"
urls.Homepage = "https://github.com/gaborbernat/bump-deps-index"
urls.Source = "https://github.com/gaborbernat/bump-deps-index"
urls.Tracker = "https://github.com/gaborbernat/bump-deps-index/issues"
scripts.bump-deps-index = "bump_deps_index.__main__:main"

[dependency-groups]
dev = [
  { include-group = "lint" },
  { include-group = "pkg-meta" },
  { include-group = "test" },
  { include-group = "type" },
]
test = [
  "covdefaults>=2.3",
  "pytest>=8.4.2",
  "pytest-cov>=7",
  "pytest-httpx>=0.35",
  "pytest-mock>=3.15.1",
]
type = [
  "ty>=0.0.17",
  { include-group = "docs" },
  { include-group = "test" },
]
docs = [
  "furo>=2025.9.25",
  "proselint>=0.14",
  "sphinx>=8.2.3",
  "sphinx-argparse-cli>=1.19",
]
lint = [ "pre-commit-uv>=4.1.5" ]
pkg-meta = [ "check-wheel-contents>=0.6.3", "twine>=6.2", "uv>=0.8.22" ]

[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "src/bump_deps_index/version.py"

[tool.black]
line-length = 120

[tool.ruff]
target-version = "py311"
line-length = 120
format.preview = true
format.docstring-code-line-length = 100
format.docstring-code-format = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "COM812", # Conflict with formatter
  "CPY",    # The project does not add copyright headers to individual files
  "D203",   # `one-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible
  "D212",   # `multi-line-summary-first-line` (D212) and `multi-line-summary-second-line` (D213) are incompatible
  "DOC",    # Public API documentation is generated from signatures
  "ISC001", # Conflict with formatter
  "RUF067", # `__init__` module should only contain docstrings and re-exports
]
lint.per-file-ignores."tests/**/*.py" = [
  "D",       # Test names document behavior
  "FBT",     # Boolean parameters keep parameterized cases compact
  "INP001",  # The tests directory is not a package
  "PLC2701", # Tests cover private parsing boundaries directly
  "PLR0917", # Test inputs favor explicit parameters over setup objects
  "PLR2004", # Literal expected values keep assertions local
  "S101",    # Tests use assertions
  "S404",    # Entry-point tests invoke a local Python executable
  "S603",    # Entry-point arguments are fixed by the tests
]
lint.isort = { known-first-party = [
  "bump_deps_index",
], required-imports = [
  "from __future__ import annotations",
] }
lint.preview = true

[tool.codespell]
builtin = "clear,usage,en-GB_to_en-US"
count = true

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.ty]
environment.python-version = "3.11"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.filterwarnings = [
  "error",
  "ignore:unclosed database in <sqlite3.Connection object at:ResourceWarning",
]
ini_options.verbosity_assertions = 2

[tool.coverage]
run.core = "ctrace"  # sysmon (3.14+ default) cannot record the per-test contexts we collect
run.parallel = true
run.plugins = [
  "covdefaults",
]
paths.source = [
  "src",
  ".tox*/*/lib/python*/site-packages",
  ".tox*/pypy*/site-packages",
  ".tox*\\*\\Lib\\site-packages",
  "*/src",
  "*\\src",
]
report.fail_under = 100
html.show_contexts = true
html.skip_covered = false
