name: Prepare release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump strategy
        required: true
        type: choice
        options:
          - auto
          - major
          - minor
          - patch
        default: auto
permissions: {}
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    uses: tox-dev/github-workflows/.github/workflows/prepare-towncrier-release.yaml@80ce6db702c52e364d49d01aea70a145a8a95930 # v5.0.2
    permissions:
      contents: read
      pull-requests: read
    with:
      bump: ${{ inputs.bump }}
      release-auth-deployment: false
    secrets:
      RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
