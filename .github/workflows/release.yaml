name: Release to PyPI
on:
  push:
    tags: ["*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@c2b2b561473103b0428e5dfd433f42d77195191c # v5.0.1
    permissions:
      contents: read
  notes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@c2b2b561473103b0428e5dfd433f42d77195191c # v5.0.1
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - name: Select previous tag
        id: previous
        uses: tox-dev/github-workflows/select-previous-tag@c2b2b561473103b0428e5dfd433f42d77195191c # v5.0.1
        with:
          tag: ${{ github.ref_name }}
      - uses: tox-dev/github-workflows/render-release-notes@c2b2b561473103b0428e5dfd433f42d77195191c # v5.0.1
        with:
          tag: ${{ github.ref_name }}
          previous: ${{ steps.previous.outputs.previous }}
          changelog: docs/changelog.rst
          artifact-url: https://pypi.org/project/bump-deps-index/${{ github.ref_name }}/
      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  publish:
    name: 🚀 publish
    needs: [build, notes]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/bump-deps-index/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions-artifact-id }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          packages-dir: dist
  release:
    needs: [build, publish, notes]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions-artifact-id }}
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.notes.outputs.artifact-id }}
          path: ${{ runner.temp }}
      - uses: tox-dev/github-workflows/reconcile-pypi-artifacts@c2b2b561473103b0428e5dfd433f42d77195191c # v5.0.1
        with:
          project: bump-deps-index
          version: ${{ github.ref_name }}
          dist: dist
      - name: Require the tag to still name the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha)" = "$GITHUB_SHA"
      - uses: tox-dev/github-workflows/publish-github-release@c2b2b561473103b0428e5dfd433f42d77195191c # v5.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes.md
