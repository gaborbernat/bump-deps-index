name: Release to PyPI
on:
  push:
    tags: ["*"]
permissions:
  contents: read
env:
  dists-artifact-name: python-package-distributions
jobs:
  build:
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@801969505384f96d16882e224e98a74bffd09d21
    permissions:
      contents: read
    with:
      changelog: docs/changelog.rst
      artifact-base-url: https://pypi.org/project/bump-deps-index/
  previous-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      previous: ${{ steps.select.outputs.previous }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@801969505384f96d16882e224e98a74bffd09d21
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - name: Select previous tag
        id: select
        uses: tox-dev/github-workflows/select-previous-tag@801969505384f96d16882e224e98a74bffd09d21
        with:
          tag: ${{ github.ref_name }}
          executable: ${{ runner.temp }}/release-tools/bin/release-creator
      - name: Record tagged commit
        id: identity
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          echo "commit=$commit" >>"$GITHUB_OUTPUT"
  contributor-metadata:
    needs: previous-tag
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Fetch contributor metadata
        if: needs.previous-tag.outputs.previous != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.previous-tag.outputs.previous }}
        run: >-
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG" -f previous_tag_name="$PREVIOUS" --jq .body >"$RUNNER_TEMP/generated-notes.md"
      - name: Fetch first-release contributor metadata
        if: needs.previous-tag.outputs.previous == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG" --jq .body >"$RUNNER_TEMP/generated-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-generated-notes
          path: ${{ runner.temp }}/generated-notes.md
          if-no-files-found: error
  github-notes:
    needs: [build, contributor-metadata]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-generated-notes
          path: ${{ runner.temp }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@801969505384f96d16882e224e98a74bffd09d21
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - name: Add release tools to PATH
        run: echo "$RUNNER_TEMP/release-tools/bin" >>"$GITHUB_PATH"
      - uses: tox-dev/github-workflows/render-release-notes@801969505384f96d16882e224e98a74bffd09d21
        with:
          tag: ${{ github.ref_name }}
          changelog: docs/changelog.rst
          artifact-url: https://pypi.org/project/bump-deps-index/${{ github.ref_name }}/
          generated-notes: ${{ runner.temp }}/generated-notes.md
          output: ${{ runner.temp }}/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  github-draft:
    needs:
      - github-notes
      - previous-tag
      - build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}
      - uses: tox-dev/github-workflows/publish-github-release@801969505384f96d16882e224e98a74bffd09d21
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ needs.previous-tag.outputs.commit }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes.md
          mode: stage
  publish:
    name: 🚀 publish
    needs:
      - build
      - github-draft
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/bump-deps-index/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.dists-artifact-name }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          packages-dir: dist
  verify-pypi:
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.dists-artifact-name }}
          path: dist/
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: tox-dev/github-workflows/reconcile-pypi-artifacts@801969505384f96d16882e224e98a74bffd09d21
        with:
          project: bump-deps-index
          version: ${{ github.ref_name }}
          dist: dist
  github-release:
    needs: [github-draft, verify-pypi, previous-tag]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}
      - uses: tox-dev/github-workflows/publish-github-release@801969505384f96d16882e224e98a74bffd09d21
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ needs.previous-tag.outputs.commit }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes.md
          mode: publish
