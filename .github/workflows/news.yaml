name: Changelog
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
permissions:
  contents: read
jobs:
  changelog:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: tox-dev/github-workflows/install-locked-tools@cf800c4abee5846b792ee00ad0c20c17a5e0b178 # v5.0.0
        with:
          groups: release-news
          venv: ${{ runner.temp }}/release-tools
      - uses: tox-dev/github-workflows/validate-news@cf800c4abee5846b792ee00ad0c20c17a5e0b178 # v5.0.0
